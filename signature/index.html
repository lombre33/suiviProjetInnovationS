<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Politique de sécurité de la page (l'image de la signature transite ici) :
  - scripts : uniquement ceux de ce dossier + l'API des widgets Grist (comme le widget principal) ;
    pas de script en ligne, pas d'évaluation dynamique de code ;
  - style : uniquement la feuille de ce dossier (aucun style en ligne) ;
  - images : celles de la page, et les aperçus locaux (blob:) de la signature ;
  - connexions : https seulement (l'adresse du document Grist n'est connue qu'au démarrage) ;
  - aucun cadre, aucun formulaire, aucune police ni ressource d'un autre site.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://docs.getgrist.com; style-src 'self'; img-src 'self' blob: data:; connect-src https:; worker-src 'self' blob:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Signature des notifications</title>
<link rel="stylesheet" href="css/signature.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<div id="sig-root"></div>
<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
<script src="js/util.js"></script>
<script src="js/acl.js"></script>
<script src="js/pdf-stamp.js"></script>
<script src="js/grist-io.js"></script>
<script src="js/signer.js"></script>
<script src="js/pdf-view.js"></script>
<script src="js/app.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
