<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Faux publipostage+ (tests du pont Grist)</title>
</head>
<body>
<script>
  // Sélecteur de modèles de publipostage+ (index.html : <select id="template-select">, « unique source de vérité » du modèle affiché, cf.
  // js/template-tree-select.js), seulement avec ?templates=1. Comme chez lui, une option vide « Nouveau modèle » ; les tests y ajoutent les
  // options et changent .value, sans évènement : l'arbre de choix de publipostage+ pose lui aussi .value sans le déclencher. Créé AVANT le
  // grist.ready() ci-dessous : chez publipostage+ le <select> est dans le HTML de la page, donc présent dès que le widget se dit prêt.
  (function () {
    if (!new URLSearchParams(location.search).has('templates')) return;
    var params = new URLSearchParams(location.search);
    var select = document.createElement('select');
    select.id = 'template-select';
    select.innerHTML = '<option value="">— Nouveau modèle —</option>';
    document.body.appendChild(select);
    // ?models=7:Courrier,9:Autre : options de la liste, ajoutées ?modelsAfter=ms après le chargement (la vraie liste se remplit de façon asynchrone).
    if (params.get('models')) setTimeout(function () {
      params.get('models').split(',').forEach(function (pair) {
        var at = pair.indexOf(':'), option = document.createElement('option');
        option.value = pair.slice(0, at); option.textContent = pair.slice(at + 1);
        select.appendChild(option);
      });
    }, Number(params.get('modelsAfter') || 0));
  })();
</script>
<!-- Widget imbriqué de test. Il charge le VRAI client grist-plugin-api de Grist (vendor/, cf. vendor/README.md) et s'abonne comme le
     fait publipostage+ (js/grist-api.js de lombre33/publipostageGrist) : grist.ready({requiredAccess:'full'}), DEUX onRecord
     (includeColumns 'shown' puis 'normal'), onOptions, et tableId via grist.getTable(). Les tests (même origine) lisent
     window.__NESTED__ et appellent window.grist depuis l'iframe. -->
<script src="vendor/grist-plugin-api.iife.min.js"></script>
<script>
  (function () {
    var nested = window.__NESTED__ = { shown: [], normal: [], options: [], tableId: null, unhandled: [] };
    // Le client plugin ne rattrape pas les échecs RPC des onRecord : ils remontent ici, visibles pour les tests.
    window.addEventListener('unhandledrejection', function (event) {
      nested.unhandled.push(String((event.reason && event.reason.message) || event.reason));
    });
    grist.ready({ requiredAccess: 'full' });
    grist.onRecord(function (record, mappings) { nested.shown.push({ record: record, mappings: mappings }); }, { includeColumns: 'shown' });
    grist.onRecord(function (record, mappings) { nested.normal.push({ record: record, mappings: mappings }); }, { includeColumns: 'normal' });
    grist.onOptions(function (options, settings) { nested.options.push({ options: options, settings: settings }); });
    grist.getTable().getTableId().then(function (id) { nested.tableId = id; });
  })();
</script>
<script>
  // Modes Édition/Lecture de publipostage+ (js/main.js), seulement avec ?modeui=1. Reproduit son démarrage réel : Édition par
  // défaut, bouton « Mode lecture » branché EN COURS de démarrage (?attachAfter=ms), puis un switchMode('edit') final
  // (?finalAfter=ms) qui ramène en Édition ce qu'un clic plus tôt avait passé en Lecture.
  (function () {
    var params = new URLSearchParams(location.search);
    if (!params.has('modeui')) return;
    var nested = window.__NESTED__;
    nested.mode = 'edit';
    nested.modeSwitches = [];
    var edit = document.createElement('button');
    edit.id = 'btn-mode-edit';
    edit.className = 'active';
    edit.textContent = 'Mode édition';
    var read = document.createElement('button');
    read.id = 'btn-mode-read';
    read.textContent = 'Mode lecture';
    document.body.appendChild(edit);
    document.body.appendChild(read);
    function switchMode(mode) {
      // ?reading=1 : la lecture épurée de publipostage+ (js/clean-reading.js) : classe de <body> posée par le bouton Mode lecture une fois la ligne « Lecture épurée » cochée.
      if (params.has('reading')) document.body.classList.toggle('pp-clean-reading', mode === 'read' && !!nested.cleanChosen);
      nested.mode = mode;
      nested.modeSwitches.push(mode);
      edit.classList.toggle('active', mode === 'edit');
      read.classList.toggle('active', mode === 'read');
    }
    if (params.has('reading')) {
      // Menu du bouton Mode lecture (index.html de publipostage+ : #v2-read-flyout, lignes .v2-hover-row[data-read-choice]) ; modèle ouvert noté à chaque évènement change.
      nested.cleanChosen = false; nested.opened = [];
      var fly = document.createElement('div');
      fly.id = 'v2-read-flyout';
      fly.innerHTML = '<div class="v2-hover-row" data-read-choice="standard">Lecture</div><div class="v2-hover-row" data-read-choice="clean">Lecture épurée</div>';
      document.body.appendChild(fly);
      fly.querySelector('[data-read-choice="clean"]').addEventListener('click', function () { nested.cleanChosen = true; });
      fly.querySelector('[data-read-choice="standard"]').addEventListener('click', function () { nested.cleanChosen = false; });
      var picker = document.getElementById('template-select');
      if (picker) picker.addEventListener('change', function () { nested.opened.push(picker.value); });
    }
    setTimeout(function () {
      edit.addEventListener('click', function () { switchMode('edit'); });
      read.addEventListener('click', function () { switchMode('read'); });
    }, Number(params.get('attachAfter') || 50));
    setTimeout(function () { switchMode('edit'); }, Number(params.get('finalAfter') || 250));
  })();
</script>
</body>
</html>
