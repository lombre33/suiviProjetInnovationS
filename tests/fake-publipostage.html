<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Faux publipostage+ (tests du pont Grist)</title>
</head>
<body>
<!-- Widget imbriqué de test. Il charge le VRAI client grist-plugin-api de Grist (vendor/, cf. vendor/README.md) et s'abonne comme le
     fait publipostage+ (js/grist-api.js de lombre33/publipostageGrist) : grist.ready({requiredAccess:'full'}), DEUX onRecord
     (includeColumns 'shown' puis 'normal'), onOptions, et tableId via grist.getTable(). Les tests (même origine) lisent
     window.__NESTED__ et appellent window.grist depuis l'iframe. -->
<script src="vendor/grist-plugin-api.iife.min.js"></script>
<script>
  (function () {
    var nested = window.__NESTED__ = { shown: [], normal: [], options: [], tableId: null, unhandled: [] };
    // Le client plugin ne rattrape pas les échecs RPC des onRecord : ils remontent ici, visibles pour les tests.
    window.addEventListener('unhandledrejection', function (event) {
      nested.unhandled.push(String((event.reason && event.reason.message) || event.reason));
    });
    grist.ready({ requiredAccess: 'full' });
    grist.onRecord(function (record, mappings) { nested.shown.push({ record: record, mappings: mappings }); }, { includeColumns: 'shown' });
    grist.onRecord(function (record, mappings) { nested.normal.push({ record: record, mappings: mappings }); }, { includeColumns: 'normal' });
    grist.onOptions(function (options, settings) { nested.options.push({ options: options, settings: settings }); });
    grist.getTable().getTableId().then(function (id) { nested.tableId = id; });
  })();
</script>
<script>
  // Modes Édition/Lecture de publipostage+ (js/main.js), seulement avec ?modeui=1. Reproduit son démarrage réel : Édition par
  // défaut, bouton « Mode lecture » branché EN COURS de démarrage (?attachAfter=ms), puis un switchMode('edit') final
  // (?finalAfter=ms) qui ramène en Édition ce qu'un clic plus tôt avait passé en Lecture.
  (function () {
    var params = new URLSearchParams(location.search);
    if (!params.has('modeui')) return;
    var nested = window.__NESTED__;
    nested.mode = 'edit';
    nested.modeSwitches = [];
    var edit = document.createElement('button');
    edit.id = 'btn-mode-edit';
    edit.className = 'active';
    edit.textContent = 'Mode édition';
    var read = document.createElement('button');
    read.id = 'btn-mode-read';
    read.textContent = 'Mode lecture';
    document.body.appendChild(edit);
    document.body.appendChild(read);
    function switchMode(mode) {
      nested.mode = mode;
      nested.modeSwitches.push(mode);
      edit.classList.toggle('active', mode === 'edit');
      read.classList.toggle('active', mode === 'read');
    }
    setTimeout(function () {
      edit.addEventListener('click', function () { switchMode('edit'); });
      read.addEventListener('click', function () { switchMode('read'); });
    }, Number(params.get('attachAfter') || 50));
    setTimeout(function () { switchMode('edit'); }, Number(params.get('finalAfter') || 250));
  })();
</script>
</body>
</html>
