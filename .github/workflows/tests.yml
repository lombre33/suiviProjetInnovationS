name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-suite:
    name: Suite de non-régression (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances de test (Playwright)
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer tests/index.html en headless
        run: npm test
