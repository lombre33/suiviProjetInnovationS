name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-suite:
    name: Suite de non-régression (headless)
    runs-on: ubuntu-24.04 # ubuntu-latest est passé en 26.04, que Playwright 1.56 ne gère pas (l'installation de Chromium échouait avant tout test)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances de test (Playwright)
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer tests/index.html en headless
        run: npm test

  envoi-grist:
    name: Envoi de l'export financier vers Grist (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer openpyxl
        run: pip install openpyxl

      - name: Lancer les tests contre un faux Grist local
        run: python -m unittest discover -s export-financier -v
