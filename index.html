<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Projets Innovation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== TOPBAR ========== -->
  <div class="topbar">
    <div class="brand">
      Suivi <span class="brand-dot">Projets</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="projets">Projets</button>
      <button class="tab-btn" data-tab="personnes">Personnes</button>
    </div>
  </div>

  <!-- ========== MAIN CONTAINER ========== -->
  <div class="container">
    
    <!-- VIEW: LISTE DES PROJETS -->
    <div id="view-list" class="view">
      <div class="section-header">
        <h1>Gestion des Projets</h1>
        <button id="btn-new-project" class="btn btn-primary">+ Créer un projet</button>
      </div>

      <div class="search-bar">
        <input id="search-input" type="text" placeholder="Chercher un projet...">
      </div>

      <div id="projects-list" class="projects-list">
        <!-- Les projets seront générés en JS -->
      </div>
    </div>

    <!-- VIEW: DÉTAIL D'UN PROJET -->
    <div id="view-project" class="view hidden">
      <button id="btn-back" class="btn btn-secondary">← Retour à la liste</button>
      
      <div class="project-detail">
        <h2 id="project-title">Détail du projet</h2>
        
        <!-- Section Porteurs -->
        <div class="section">
          <h3>Porteurs et Accompagnement</h3>
          <div class="form-group">
            <label>Porteur 1</label>
            <div class="search-select" data-field="Porteur_1">
              <input class="search-input" type="text" placeholder="Chercher un porteur...">
              <div class="search-dropdown hidden"></div>
            </div>
          </div>
          <div class="form-group">
            <label>VP Porteur 2</label>
            <div class="search-select" data-field="VP_Porteur_2">
              <input class="search-input" type="text" placeholder="Chercher un VP...">
              <div class="search-dropdown hidden"></div>
            </div>
          </div>
          <div class="form-group">
            <label>Accompagnateur</label>
            <div class="search-select" data-field="Accompagnateur">
              <input class="search-input" type="text" placeholder="Chercher un accompagnateur...">
              <div class="search-dropdown hidden"></div>
            </div>
          </div>
        </div>

        <!-- Section Administratif -->
        <div class="section">
          <h3>Administratif</h3>
          <div class="form-group">
            <label>Instance rattachée</label>
            <select id="field-Instance_rattachée" class="form-control">
              <option value="">-- Sélectionner une instance --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date limite de financement</label>
            <input id="field-Date_limite" type="date" class="form-control">
          </div>
          <div class="form-group">
            <label>Programme</label>
            <select id="field-Programme" class="form-control">
              <option value="">-- Sélectionner un programme --</option>
            </select>
          </div>
        </div>

        <!-- Section Descriptif -->
        <div class="section">
          <h3>Descriptif</h3>
          <div class="form-group">
            <label>Titre du projet</label>
            <input id="field-Titre" type="text" class="form-control">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="field-Description" class="form-control" rows="4"></textarea>
          </div>
        </div>

        <!-- Boutons d'action -->
        <div class="modal-actions">
          <button id="btn-save-project" class="btn btn-primary">Enregistrer</button>
          <button id="btn-cancel-project" class="btn btn-secondary">Annuler</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ========== MODALES ========== -->
  
  <!-- MODALE: Nouveau/Édition Projet -->
  <div id="modal-project" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Ajouter/Modifier un projet</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Titre du projet</label>
          <input data-field="Titre" type="text" class="form-control" placeholder="Entrez le titre">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea data-field="Description" class="form-control" placeholder="Décrivez le projet..."></textarea>
        </div>
        <div class="form-group">
          <label>Porteur 1</label>
          <div class="search-select" data-field="Porteur_1">
            <input class="search-input" type="text" placeholder="Chercher un porteur...">
            <div class="search-dropdown hidden"></div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-project-modal" class="btn btn-primary">Enregistrer</button>
        <button id="btn-cancel-project-modal" class="btn btn-secondary">Annuler</button>
      </div>
    </div>
  </div>

  <!-- MODALE: Ajouter/Éditer Personne -->
  <div id="modal-person" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Ajouter/Modifier une personne</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Prénom et Nom</label>
          <input data-field="Nom" type="text" class="form-control" placeholder="Prénom Nom">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input data-field="Email" type="email" class="form-control" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input data-field="Telephone" type="tel" class="form-control" placeholder="+33 6 12 34 56 78">
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-person-modal" class="btn btn-primary">Enregistrer</button>
        <button id="btn-cancel-person-modal" class="btn btn-secondary">Annuler</button>
      </div>
    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/grist-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
