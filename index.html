<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Suivi Projet Innovation S</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Suivi Projet Innovation S</h1>
      <nav>
        <button data-view="projects">Projets</button>
        <button data-view="dashboard">Tableau de bord</button>
      </nav>
    </header>

    <main>
      <div id="error-container" class="hidden">
        <div class="error-message">
          <span id="error-text"></span>
          <button id="close-error">×</button>
        </div>
      </div>

      <section id="view-projects" class="view">
        <div class="view-header">
          <h2>Liste des projets</h2>
          <button id="btn-new-project" class="btn btn-primary">+ Nouveau projet</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nom</th>
                <th>Statut</th>
                <th>Progression</th>
                <th>Propriétaire</th>
                <th>Budget</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projects-tbody">
              <!-- Projects loaded dynamically -->
            </tbody>
          </table>
        </div>
      </section>

      <section id="view-project" class="view hidden">
        <div class="view-header">
          <button id="btn-back-projects" class="btn btn-secondary">← Retour</button>
          <h2 id="project-title"></h2>
        </div>
        <div class="project-details">
          <div class="project-info">
            <p><strong>Statut:</strong> <span id="project-status"></span></p>
            <p><strong>Propriétaire:</strong> <span id="project-owner"></span></p>
            <p><strong>Budget:</strong> <span id="project-budget"></span></p>
            <p><strong>Progression:</strong> <span id="project-progress"></span></p>
            <p><strong>Description:</strong></p>
            <p id="project-description"></p>
          </div>
          <div class="project-tasks">
            <h3>📌 Tâches</h3>
            <div id="tasks-list"></div>
          </div>
        </div>
      </section>

      <section id="view-dashboard" class="view hidden">
        <h2>Tableau de bord</h2>
        <div id="dashboard-content"></div>
      </section>

      <section id="view-kanban" class="view hidden">
        <h2>Kanban</h2>
        <div id="kanban-content"></div>
      </section>
    </main>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/grist-api.js"></script>
  <script src="js/pages/page-projets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
