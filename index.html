<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Projet Innovation S</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-content">
                <h1>📊 Suivi Projet Innovation S</h1>
                <div class="nav-buttons">
                    <button id="btn-new-project" class="btn btn-primary">➕ Nouveau Projet</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Vue Liste -->
            <div id="view-list" class="view active">
                <div class="view-header">
                    <h2>📋 Liste des Projets</h2>
                    <div class="filters">
                        <select id="filter-status" class="filter-select">
                            <option value="">Tous les statuts</option>
                            <option value="En cours">En cours</option>
                            <option value="Planifié">Planifié</option>
                            <option value="Terminé">Terminé</option>
                            <option value="En attente">En attente</option>
                        </select>
                    </div>
                </div>

                <div class="projects-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Statut</th>
                                <th>Progression</th>
                                <th>Propriétaire</th>
                                <th>Budget</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projects-tbody">
                            <!-- Les projets seront insérés ici -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Vue Projet -->
            <div id="view-project" class="view">
                <div class="view-header">
                    <button id="btn-back" class="btn btn-secondary">← Retour</button>
                    <h2 id="project-title">Détails du Projet</h2>
                </div>

                <div class="project-details">
                    <div class="detail-section">
                        <h3>Information Générale</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>Nom</label>
                                <p id="detail-name"></p>
                            </div>
                            <div class="detail-item">
                                <label>Statut</label>
                                <p id="detail-status"></p>
                            </div>
                            <div class="detail-item">
                                <label>Progression</label>
                                <div class="progress-bar">
                                    <div id="detail-progress" class="progress-fill"></div>
                                </div>
                                <span id="detail-progress-text">0%</span>
                            </div>
                            <div class="detail-item">
                                <label>Propriétaire</label>
                                <p id="detail-owner"></p>
                            </div>
                            <div class="detail-item">
                                <label>Budget</label>
                                <p id="detail-budget"></p>
                            </div>
                            <div class="detail-item">
                                <label>Dates</label>
                                <p id="detail-dates"></p>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>Description</h3>
                        <p id="detail-description"></p>
                    </div>

                    <div class="detail-section">
                        <h3>Tâches</h3>
                        <div id="tasks-list" class="tasks-list">
                            <!-- Les tâches seront insérées ici -->
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>Équipe</h3>
                        <div id="team-list" class="team-list">
                            <!-- L'équipe sera insérée ici -->
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>Chronologie</h3>
                        <div id="timeline-list" class="timeline-list">
                            <!-- La chronologie sera insérée ici -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Zone d'erreur -->
            <div id="error-container" class="error-container"></div>
        </main>
    </div>

    <!-- Scripts - Ordre important ! -->
    <!-- 1. Grist Plugin API (REQUIRED - must be first) -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <!-- 2. Core modules (in order) -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/grist-api.js"></script>

    <!-- 3. Application -->
    <script src="js/app.js"></script>

    <!-- 4. External (Cloudflare Insights - optional) -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v3d52b47920f24c319d37e2661827c42b1787588026925"></script>
</body>
</html>
