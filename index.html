<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Suivi Projet Innovation S</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kanban.css"><link rel="stylesheet" href="css/creation-projet.css"><link rel="stylesheet" href="css/administratif.css"></head>
<body><div id="main-container" class="container"><header id="header" class="header"><h1><span class="brand-mark">S</span>Suivi Projet Innovation S</h1><nav class="nav"><button id="btn-projects" class="nav-btn active" data-view="view-projects">Projets</button><button class="nav-btn" data-view="view-administratif">Administratif</button><button class="nav-btn" data-view="view-installation-fonds">Installation des fonds</button><button class="nav-btn" data-view="view-suivi-operationnel">Suivi opérationnel</button><button class="nav-btn" data-view="view-todo">To Do</button></nav></header><div id="error-container" class="error-container hidden"><div class="error-message"><span id="error-text"></span><button id="error-close" class="error-close">&times;</button></div></div><main id="view-projects" class="view"><div class="project-filters" role="search" aria-label="Filtres des projets"><label class="filter-combo"><span class="visually-hidden">Programme</span><input id="filter-programme" type="search" placeholder="Tous les programmes" autocomplete="off" role="combobox" aria-controls="filter-programme-list" aria-autocomplete="list"><span id="filter-programme-list" class="combo-list" role="listbox" hidden></span></label><label class="filter-combo"><span class="visually-hidden">Instance</span><input id="filter-instance" type="search" placeholder="Toutes les instances" autocomplete="off" role="combobox" aria-controls="filter-instance-list" aria-autocomplete="list"><span id="filter-instance-list" class="combo-list" role="listbox" hidden></span></label><label class="filter-search"><span class="visually-hidden">Recherche</span><input id="filter-search" type="search" placeholder="Acronyme…" autocomplete="off"></label><button id="clear-filters" class="btn btn-secondary" type="button">Réinitialiser</button><div id="kanban-hidden-columns" class="kanban-hidden-columns" hidden></div><button id="btn-new-project" class="btn btn-primary">+ Nouveau Projet</button></div><div id="projects-kanban" class="kanban-board" aria-live="polite"></div></main><section id="view-project" class="view hidden"><div class="view-header"><button id="btn-back" class="btn btn-secondary">← Retour</button><h2 id="project-title"></h2></div><div class="project-details"><div class="project-info"><p><strong>Statut:</strong> <span id="project-status"></span></p><p><strong>Porteur:</strong> <span id="project-owner"></span></p><p><strong>Description:</strong> <span id="project-description"></span></p></div><div class="project-tasks"><h3>Tâches</h3><div id="tasks-list"></div></div></div></section><section id="view-administratif" class="view hidden"><div class="project-filters admin-filters" role="search" aria-label="Filtres Administratif"><div class="admin-tabs" role="tablist" aria-label="Notifications ou Conventions"><button type="button" class="admin-tab is-active" data-admin-tab="notif" role="tab" aria-selected="true">Notifications</button><button type="button" class="admin-tab" data-admin-tab="conv" role="tab" aria-selected="false">Conventions</button></div><label class="filter-combo"><span class="visually-hidden">Programme</span><input id="admin-filter-programme" type="search" placeholder="Tous les programmes" autocomplete="off" role="combobox" aria-controls="admin-filter-programme-list" aria-autocomplete="list"><span id="admin-filter-programme-list" class="combo-list" role="listbox" hidden></span></label><label class="filter-combo"><span class="visually-hidden">Instance</span><input id="admin-filter-instance" type="search" placeholder="Toutes les instances" autocomplete="off" role="combobox" aria-controls="admin-filter-instance-list" aria-autocomplete="list"><span id="admin-filter-instance-list" class="combo-list" role="listbox" hidden></span></label><label class="filter-search"><span class="visually-hidden">Recherche</span><input id="admin-filter-search" type="search" placeholder="Acronyme…" autocomplete="off"></label><button id="admin-clear-filters" class="btn btn-secondary" type="button">Réinitialiser</button><div id="admin-hidden-panels" class="kanban-hidden-columns" hidden></div><button id="admin-toggle-view" type="button" class="kanban-icon-btn admin-view-toggle" aria-label="Afficher en cartes"></button></div><div class="admin-panels-wrap"><section class="admin-column" data-admin-panel="notif" aria-label="Notifications"><div id="admin-col-notif" class="admin-panels"></div></section><section class="admin-column is-hidden" data-admin-panel="conv" aria-label="Conventions"><div id="admin-col-conv" class="admin-panels"></div></section></div></section><section id="view-installation-fonds" class="view hidden placeholder-view"><div class="view-header"><h2>Installation des fonds</h2></div><p class="placeholder-message">Cette rubrique sera disponible dans une prochaine étape.</p></section><section id="view-suivi-operationnel" class="view hidden placeholder-view"><div class="view-header"><h2>Suivi opérationnel</h2></div><p class="placeholder-message">Cette rubrique sera disponible dans une prochaine étape.</p></section><section id="view-todo" class="view hidden placeholder-view"><div class="view-header"><h2>To Do</h2></div><p class="placeholder-message">Cette rubrique sera disponible dans une prochaine étape.</p></section></div><div id="toast" class="toast hidden"></div><script src="js/core/utils.js"></script><script src="js/core/state.js"></script><script src="js/core/grist-api.js"></script><script src="js/components/project-modal.js"></script><script src="js/components/poste-modal.js"></script><script src="js/components/person-modal.js"></script><script src="js/pages/page-projets.js"></script><script src="js/pages/page-administratif.js"></script><script src="js/app.js"></script></body></html>
