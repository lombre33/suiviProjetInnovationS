<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Projet Innovation</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styles pour le dropdown de sélection de personne */
    .person-select-dropdown {
      position: absolute;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      min-width: 200px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .person-select-option, .person-select-create {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .person-select-option:hover, .person-select-create:hover {
      background-color: #f5f5f5;
    }
    .person-select-create {
      font-weight: bold;
      color: #0066cc;
      background-color: #f0f8ff;
    }
    .person-select-error {
      padding: 10px;
      color: #d9534f;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Modal de création de personne -->
  <div id="personModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Créer une nouvelle personne</h2>
        <button class="close-modal" type="button">&times;</button>
      </div>
      <form id="personForm">
        <div class="form-group">
          <label for="personNom">Nom *</label>
          <input type="text" id="personNom" name="nom" required>
        </div>
        <div class="form-group">
          <label for="personPrenom">Prénom *</label>
          <input type="text" id="personPrenom" name="prenom" required>
        </div>
        <div class="form-group">
          <label for="personStructure">Structure</label>
          <input type="text" id="personStructure" name="structure" list="structuresList" placeholder="Tapez pour rechercher...">
          <datalist id="structuresList"></datalist>
        </div>
        <div class="form-group">
          <label for="personEmail">Email</label>
          <input type="email" id="personEmail" name="email">
        </div>
        <div class="form-group">
          <label for="personTel">Téléphone</label>
          <input type="tel" id="personTel" name="tel">
        </div>
        <div class="form-group">
          <label for="personPoste">Poste</label>
          <input type="text" id="personPoste" name="poste" list="postesList" placeholder="Tapez pour rechercher...">
          <datalist id="postesList"></datalist>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel close-modal">Annuler</button>
          <button type="submit" class="btn-save">Créer la personne</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/grist.js"></script>
  <script src="js/components/project-modal.js"></script>
  <script src="js/components/person-modal.js"></script>
  <script src="js/components/person-select.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
