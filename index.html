<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi Projets InnovationS</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/creation-projet.css">
</head>
<body>
<div id="app">
  <header class="topbar"><div class="brand"><span class="brand-dot"></span>Suivi des Projets — InnovationS</div><button id="btn-new-project" class="btn btn-primary">+ Nouveau projet</button></header>
  <section id="view-list" class="view"><div class="list-toolbar"><input id="search-projects" type="text" placeholder="Rechercher un projet, un acronyme, un porteur..."></div><table class="grid-table" id="projects-table"><thead><tr><th>Acronyme</th><th>Projet</th><th>Programme</th><th>Porteur 1</th><th>Statut opérationnel</th></tr></thead><tbody id="projects-tbody"></tbody></table></section>
  <section id="view-project" class="view hidden"><div class="project-header"><button id="btn-back" class="btn btn-secondary">← Retour à la liste</button><h2 id="project-title">Nouveau projet</h2></div></section>
</div><div id="toast" class="toast hidden"></div>
<script src="js/core/utils.js"></script><script src="js/core/state.js"></script><script src="js/core/grist-api.js"></script><script src="js/pages/page-projets.js"></script><script src="js/pages/page-creation-projet.js"></script><script src="js/app.js"></script>
</body></html>
